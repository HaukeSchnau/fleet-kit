<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet explorer</title>
<style>
:root {
  --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a64; --line: #dedbd2; --card: #fff; --soft: #f2f0ea; --grp: #f4f2ec;
  --accent: #2357c6; --accent-soft: #e6edfb; --green: #1f7a4d; --green-soft: #e3f3ea; --orange: #b4560f; --orange-soft: #fbeadb;
  --red: #b42323; --red-soft: #fbe3e3; --purple: #6b3fb3; --purple-soft: #eee6fa; --teal: #0f7a80; --teal-soft: #dff2f3;
  --amber: #9a6b00; --amber-soft: #fbf0cf; --code: #f3f1eb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161614; --fg: #e9e7e1; --muted: #9b998f; --line: #34332f; --card: #1e1e1b; --soft: #24231f; --grp: #1b1b19;
    --accent: #7ea2ff; --accent-soft: #1f2a44; --green: #63c38f; --green-soft: #183126; --orange: #f0a060; --orange-soft: #3a2616;
    --red: #ff7b7b; --red-soft: #3d1d1d; --purple: #b597f0; --purple-soft: #2c2240; --teal: #5fc9cf; --teal-soft: #15302f;
    --amber: #e6b94a; --amber-soft: #352b10; --code: #22211e;
  }
}
:root[data-theme="dark"] {
  --bg: #161614; --fg: #e9e7e1; --muted: #9b998f; --line: #34332f; --card: #1e1e1b; --soft: #24231f; --grp: #1b1b19;
  --accent: #7ea2ff; --accent-soft: #1f2a44; --green: #63c38f; --green-soft: #183126; --orange: #f0a060; --orange-soft: #3a2616;
  --red: #ff7b7b; --red-soft: #3d1d1d; --purple: #b597f0; --purple-soft: #2c2240; --teal: #5fc9cf; --teal-soft: #15302f;
  --amber: #e6b94a; --amber-soft: #352b10; --code: #22211e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
main { max-width: 1400px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 4px 0 2px; }
h4 { font-size: 12px; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.pad { padding: 16px; }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.box { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; margin: 12px 0; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; background: var(--soft); border-bottom: 1px solid var(--line); }
.tab { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.tab.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.btn.danger { color: var(--red); border-color: var(--red); }
.q { padding: 8px 12px 0; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.body { display: grid; grid-template-columns: 1fr; }
@media (min-width: 960px) { .body { grid-template-columns: minmax(0, 1fr) 320px; } }
#canvas { overflow: auto; min-height: 360px; max-height: 80vh; padding: 6px; }
@media (min-width: 960px) { #canvas { border-right: 1px solid var(--line); } }
#details { padding: 10px 12px; font-size: 13px; max-height: 80vh; overflow-y: auto; }
.d-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.d-head strong { font-size: 15px; }
.d-id { display: inline-block; margin: 4px 0; word-break: break-all; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); }
.r-nix { background: var(--green); } .r-stack { background: var(--purple); } .r-runtime { background: var(--amber); } .r-manual { background: var(--red); }
.chip.r-nix { background: var(--green-soft); color: var(--green); border-color: transparent; }
.chip.r-stack { background: var(--purple-soft); color: var(--purple); border-color: transparent; }
.chip.r-runtime { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
.chip.r-manual { background: var(--red-soft); color: var(--red); border-color: transparent; }
.chip.p-sleeps, .chip.p-roaming { background: var(--amber-soft); color: var(--amber); border-color: transparent; }
dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 6px 0; }
dl.facts dt { color: var(--muted); } dl.facts dd { margin: 0; }
ul.elist { list-style: none; padding: 0; margin: 2px 0 6px; }
ul.elist li { padding: 2px 0; }
.ek { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--soft); }
.d-actions { margin: 10px 0 4px; }
.blast-sum { font-weight: 600; } .t-down { color: var(--red); } .t-deg { color: var(--amber); }
svg.graph { display: block; font-family: inherit; }
svg.graph .grp rect { fill: var(--grp); stroke: var(--line); stroke-width: 1.2; }
svg.graph .grp .gt { font-size: 14px; font-weight: 700; fill: var(--fg); }
svg.graph .grp .gs { font-size: 11px; fill: var(--muted); }
svg.graph .grp, svg.graph .nd { cursor: pointer; }
svg.graph .nd rect { fill: var(--card); stroke: var(--muted); stroke-width: 1.1; }
svg.graph .nd .nt { font-size: 12.5px; font-weight: 600; fill: var(--fg); text-anchor: middle; }
svg.graph .nd .ns { font-size: 10.5px; fill: var(--muted); text-anchor: middle; }
svg.graph .k-route rect { fill: var(--accent-soft); stroke: var(--accent); }
svg.graph .k-route.vis-public rect { fill: var(--orange-soft); stroke: var(--orange); }
svg.graph .k-ext rect { stroke-dasharray: 4 3; fill: var(--soft); }
svg.graph .k-net rect { fill: var(--teal-soft); stroke: var(--teal); }
svg.graph .k-host rect { fill: var(--grp); stroke: var(--fg); stroke-width: 1.4; }
svg.graph .k-state rect { fill: var(--amber-soft); stroke: var(--amber); }
svg.graph .k-secret rect { fill: var(--red-soft); stroke: var(--red); }
svg.graph .nd.runtime rect { stroke-dasharray: 5 3; }
svg.graph path.ed { fill: none; stroke-width: 1.3; opacity: .75; }
svg.graph path.ed.derived { stroke-dasharray: 4 3; }
svg.graph .ah { stroke: none; fill: var(--muted); }
svg.graph path.e-uses { stroke: var(--accent); } svg.graph .ah.e-uses { fill: var(--accent); }
svg.graph path.e-serves, svg.graph path.e-enters { stroke: var(--green); } svg.graph .ah.e-serves, svg.graph .ah.e-enters { fill: var(--green); }
svg.graph path.e-storesIn, svg.graph path.e-backedUpTo { stroke: var(--amber); } svg.graph .ah.e-storesIn, svg.graph .ah.e-backedUpTo { fill: var(--amber); }
svg.graph path.e-reads { stroke: var(--red); } svg.graph .ah.e-reads { fill: var(--red); }
svg.graph path.e-buildsFrom { stroke: var(--purple); } svg.graph .ah.e-buildsFrom { fill: var(--purple); }
svg.graph path.e-memberOf, svg.graph path.e-hostedBy, svg.graph path.e-provides, svg.graph path.e-runsOn { stroke: var(--muted); }
svg.graph.has-sel path.ed { opacity: .12; } svg.graph.has-sel path.ed.hl { opacity: 1; stroke-width: 2; }
svg.graph.has-sel .nd { opacity: .35; } svg.graph.has-sel .nd.sel, svg.graph.has-sel .nd.near { opacity: 1; }
svg.graph .nd.sel rect, svg.graph .grp.sel rect { stroke: var(--fg); stroke-width: 2.6; }
svg.graph.has-blast path.ed { opacity: .18; } svg.graph.has-blast .nd { opacity: .45; }
svg.graph.has-blast .nd.down, svg.graph.has-blast .nd.degraded, svg.graph.has-blast .nd.sel { opacity: 1; }
svg.graph .down rect { fill: var(--red-soft); stroke: var(--red); stroke-width: 2; }
svg.graph .degraded rect { fill: var(--amber-soft); stroke: var(--amber); stroke-width: 2; }
.hosts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; padding: 6px; }
.hcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); cursor: pointer; }
.hcard.over { border-color: var(--red); } .hcard.sel { outline: 2px solid var(--fg); }
.hcard.down { background: var(--red-soft); } .hcard.degraded { background: var(--amber-soft); }
.hc-head { display: flex; justify-content: space-between; align-items: center; }
.membar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; margin: 6px 0 2px; border: 1px solid var(--line); }
.seg { display: block; height: 100%; }
.seg.free { background: var(--soft); }
.seg.batch { display: flex; outline: 1px dashed var(--fg); outline-offset: -1px; }
.legend-mini i.sw.batch { outline: 1px dashed var(--fg); outline-offset: -1px; }
.c-reserve { background: var(--muted); } .c-services { background: var(--accent); } .c-agents { background: var(--teal); } .c-ci { background: var(--purple); } .c-builds { background: var(--orange); } .c-maintenance { background: var(--amber); }
.hcard.over .hc-mem { color: var(--red); font-weight: 600; }
.legend-mini { display: flex; flex-wrap: wrap; gap: 8px; font-size: 11.5px; color: var(--muted); margin: 2px 0; }
.legend-mini i.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
ul.svcs { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 4px; }
li.svc { font-size: 12px; padding: 2px 7px; border-radius: 6px; border: 1px solid var(--line); background: var(--soft); }
li.svc.runtime { border-style: dashed; } li.svc.sel { outline: 2px solid var(--fg); }
li.svc.down { background: var(--red-soft); border-color: var(--red); } li.svc.degraded { background: var(--amber-soft); border-color: var(--amber); }
li.svc .b { margin-left: 5px; font-size: 10.5px; color: var(--muted); }
#coverage { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0; }
#findings { padding-left: 18px; margin: 6px 0; }
#findings li { margin: 4px 0; }
.f-error strong { color: var(--red); } .f-warn strong { color: var(--amber); } .f-accepted strong { color: var(--muted); }
.foot { padding: 10px 12px; border-top: 1px solid var(--line); font-size: 13px; }
details summary { cursor: pointer; padding: 8px 12px; color: var(--muted); }
#src { margin: 0 12px 12px; padding: 10px 12px; background: var(--code); border-radius: 8px; max-height: 380px; overflow: auto; white-space: pre; }
#src-tabs { display: flex; gap: 6px; padding: 0 12px 8px; }
</style>
</head>
<body>
<main>
  <h1>Fleet explorer</h1>
  <p class="muted">Every view of fleet.json. Click a node for its facts and edges; "Fail it" shows what breaks.</p>
  <div class="box">
    <div class="bar" id="tabs"></div>
    <div class="q"><span id="question"></span><button class="btn" type="button" id="zoom">Fit everything</button></div>
    <div class="body"><div id="canvas"></div><div id="details"></div></div>
    <details>
      <summary>D2 and JSON for this view</summary>
      <div id="src-tabs"><button class="tab on" type="button" data-src="d2">D2</button><button class="tab" type="button" data-src="json">JSON</button></div>
      <pre id="src"></pre>
    </details>
  </div>
  <div class="box">
    <div class="foot">
      <strong>Findings</strong>
      <ul id="findings"></ul>
      <strong>Declarative coverage</strong>
      <div id="coverage"></div>
      <div id="coverage-legend" class="muted"></div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/elkjs@0.11.1/lib/elk.bundled.js"></script>
<script type="module" src="explorer.js"></script>
</body>
</html>
